name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    # Every example under examples/ must validate against this provider's
    # schema, so the docs cannot drift back to old attribute names. The
    # conformance suite needs the bahriya/openapi package beside this
    # repository and runs with `make test` in the platform workspace.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Examples are formatted
        run: terraform fmt -check -recursive examples

      - name: Validate every example
        run: go test ./internal/provider -run 'TestDocsExamplesValidate' -count=1 -v
